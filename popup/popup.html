<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HLS Cache Player</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none"><rect width="24" height="24" rx="6" fill="#22D3EE"/><path d="M9 7.5v9l8-4.5z" fill="#0B0E14"/></svg>
      <div>
        <b>HLS Cache Player</b>
        <span id="subtitle">当前页嗅探结果</span>
      </div>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab active" data-view="sniff">嗅探</button>
    <button class="tab" data-view="cache">缓存</button>
    <button class="tab" data-view="cache" data-clear="1" style="margin-left:auto" title="清空所有缓存" id="clearBtn">清空</button>
  </nav>

  <main id="list">
    <div class="loading-msg" id="loading">加载中…</div>
  </main>

  <footer>
    <button id="settingsBtn" class="ghost">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke="currentColor"><path d="M4 21v-7m0-4V3m8 18v-9m0-4V3m8 18v-5m0-4V3M1 14h6m2-6h6m2 8h6"/></svg>
      设置
    </button>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
