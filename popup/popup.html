<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HLS Cache Player</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none"><rect width="24" height="24" rx="6" fill="#22D3EE"/><path d="M9 7.5v9l8-4.5z" fill="#0B0E14"/></svg>
      <div>
        <b>HLS Cache Player</b>
        <span id="subtitle">当前页嗅探结果</span>
      </div>
    </div>
    <span id="version" class="version"></span>
  </header>

  <nav class="tabs" id="mainNav">
    <button class="tab active" data-view="sniff">嗅探</button>
    <button class="tab" data-view="cache">缓存</button>
    <button class="tab" style="margin-left:auto" title="清空当前页嗅探结果" id="clearBtn">清空</button>
  </nav>

  <main id="list">
    <div class="loading-msg" id="loading">加载中…</div>
  </main>

  <section id="settingsView" hidden>
    <div class="settings-head">
      <button id="backBtn" class="icon-btn" title="返回">‹</button>
      <b>设置</b>
    </div>
    <div class="settings-group">
      <div class="settings-row"><span>自动嗅探网页 m3u8</span><label class="switch"><input type="checkbox" id="sniffEnabled"><span class="sl"></span></label></div>
      <div class="settings-row"><span>最大并发请求数</span><input type="number" id="maxConcurrent" min="1" max="64"></div>
      <div class="settings-row"><span>单分片请求超时（秒）</span><input type="number" id="timeoutMs" min="1" max="120"></div>
      <div class="settings-row"><span>失败重试次数</span><input type="number" id="maxRetry" min="0" max="10"></div>
    </div>
    <div class="settings-group proxy-group">
      <div class="settings-row"><label for="downloadProxyEnabled">启用下载代理</label><label class="switch"><input type="checkbox" id="downloadProxyEnabled" aria-describedby="proxyScope"><span class="sl"></span></label></div>
      <label class="proxy-address" for="downloadProxyUrl">代理地址
        <input type="text" id="downloadProxyUrl" placeholder="http://127.0.0.1:7890" spellcheck="false" autocomplete="off" title="支持 HTTP(S)、SOCKS4、SOCKS5，无账号密码" aria-describedby="proxyScope">
      </label>
      <div id="relaySettings" hidden>
        <label class="proxy-address" for="downloadRelayUrl">本地服务
          <input type="text" id="downloadRelayUrl" placeholder="http://127.0.0.1:17891" spellcheck="false" autocomplete="off" aria-describedby="relayHelp">
        </label>
        <p class="settings-note" id="relayHelp">启动服务（Node.js 18+）：<code>node tools/download-relay.cjs</code></p>
      </div>
      <p class="settings-note" id="proxyScope">仅用于扩展下载，支持 HTTP(S)、SOCKS4/5。</p>
    </div>
    <p class="settings-note">导出格式固定为 MP4，文件名使用当前网页标题。</p>
    <p id="settingsError" class="settings-error" role="alert" hidden></p>
    <div class="settings-actions">
      <button id="resetSettings" class="ghost">恢复默认</button>
      <button id="saveSettings" class="primary">保存设置</button>
    </div>
  </section>

  <footer id="mainFooter">
    <button id="settingsBtn" class="ghost">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke="currentColor"><path d="M4 21v-7m0-4V3m8 18v-9m0-4V3m8 18v-5m0-4V3M1 14h6m2-6h6m2 8h6"/></svg>
      设置
    </button>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
